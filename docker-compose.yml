version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/algonova
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_super_secret_jwt_key
    depends_on:
      - mongo
      - redis
    networks:
      - algonova_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - algonova_net

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - algonova_net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - algonova_net

networks:
  algonova_net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
